<style>
  .chat-window{
    position:fixed;
    right:32px;
    bottom:126px;
    width:340px;
    max-width:calc(100vw - 40px);
    height:440px;
    max-height:calc(100vh - 160px);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,0.35);
    display:none;
    flex-direction:column;
    overflow:hidden;
    z-index:30;
  }
  .chat-window.open{ display:flex; }

  .chat-window-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    background:var(--surface-raised);
    border-bottom:1px solid var(--border);
  }
  .chat-window-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:14px;
    color:var(--text);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .chat-window-title::before{
    content:"";
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
  }
  .chat-window-close{
    background:none;
    border:none;
    color:var(--text-muted);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    padding:4px;
  }
  .chat-window-close:hover{ color:var(--text); }

  .chat-messages{
    flex:1;
    overflow-y:auto;
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .chat-msg{
    max-width:80%;
    padding:9px 13px;
    border-radius:14px;
    font-size:13.5px;
    line-height:1.4;
    word-wrap:break-word;
  }
  .chat-msg.bot{
    align-self:flex-start;
    background:var(--accent-soft);
    color:var(--text);
    border-bottom-left-radius:4px;
  }
  .chat-msg.user{
    align-self:flex-end;
    background:var(--accent);
    color:#000000;
    border-bottom-right-radius:4px;
  }
  .chat-msg.typing{
    align-self:flex-start;
    background:var(--accent-soft);
    color:var(--text-muted);
    font-style:italic;
  }

  .chat-input-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px;
    border-top:1px solid var(--border);
    background:var(--surface-raised);
  }
  .chat-input{
    flex:1;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:20px;
    padding:9px 14px;
    font-size:13.5px;
    color:var(--text);
    font-family:var(--font-body);
    outline:none;
  }
  .chat-input:focus{ border-color:var(--accent); }
  .chat-send-btn{
    width:34px;height:34px;
    border-radius:50%;
    background:var(--accent);
    border:none;
    color:#000000;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .chat-send-btn svg{ width:16px;height:16px; }

  @media (max-width:900px){
    .chat-window{
      right:16px;
      bottom:170px;
      width:calc(100vw - 32px);
    }
  }
</style>

<div class="chat-window" id="chatWindow">
  <div class="chat-window-header">
    <div class="chat-window-title">BetterWallet AI</div>
    <button class="chat-window-close" onclick="closeChatWindow()">&times;</button>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div class="chat-msg bot">Hi! I'm your BetterWallet assistant. Ask me anything about your account, StaffHook, Better-Trust, or registrations.</div>
  </div>
  <div class="chat-input-row">
    <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter'){sendChatMessage();}">
    <button class="chat-send-btn" onclick="sendChatMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
</div>

<script>
  function toggleChatWindow(){
    const win = document.getElementById('chatWindow');
    win.classList.toggle('open');
    if(win.classList.contains('open')){
      document.getElementById('chatInput').focus();
    }
  }

  function openChatWindow(){
    document.getElementById('chatWindow').classList.add('open');
    document.getElementById('chatInput').focus();
  }

  function closeChatWindow(){
    document.getElementById('chatWindow').classList.remove('open');
  }

  async function sendChatMessage(){
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text) return;

    const messages = document.getElementById('chatMessages');

    const userBubble = document.createElement('div');
    userBubble.className = 'chat-msg user';
    userBubble.textContent = text;
    messages.appendChild(userBubble);

    input.value = '';
    messages.scrollTop = messages.scrollHeight;

    const typingBubble = document.createElement('div');
    typingBubble.className = 'chat-msg typing';
    typingBubble.textContent = 'Typing...';
    messages.appendChild(typingBubble);
    messages.scrollTop = messages.scrollHeight;

    try{
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await response.json();

      typingBubble.remove();

      const botBubble = document.createElement('div');
      botBubble.className = 'chat-msg bot';
      botBubble.textContent = data.reply || "Sorry, I couldn't process that right now.";
      messages.appendChild(botBubble);
      messages.scrollTop = messages.scrollHeight;
    }catch(err){
      typingBubble.remove();
      const errBubble = document.createElement('div');
      errBubble.className = 'chat-msg bot';
      errBubble.textContent = "I'm having trouble connecting right now. Please try again.";
      messages.appendChild(errBubble);
      messages.scrollTop = messages.scrollHeight;
    }
  }
</script>
